<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body class="settings-body">
    <main class="settings-page">
        <header class="settings-header">
            <span class="settings-icon" aria-hidden="true">
                ⚙
            </span>

            <h1 data-i18n="settings.title"></h1>
        </header>

        <section class="settings-card">
            <label
                for="language-select"
                data-i18n="settings.language"
            ></label>

            <select id="language-select"></select>
        </section>

        <section class="settings-card">
            <label
                for="theme-select"
                data-i18n="settings.colorScheme"
            ></label>

            <select id="theme-select"></select>
        </section>

        <section class="settings-card appearance-settings-card">
            <h2 data-i18n="settings.appearance"></h2>

            <div class="range-setting">
                <div class="range-setting-header">
                    <label
                        for="window-transparency-input"
                        data-i18n="settings.windowTransparency"
                    ></label>

                    <output
                        id="window-transparency-value"
                        for="window-transparency-input"
                    ></output>
                </div>

                <input
                    id="window-transparency-input"
                    type="range"
                    min="0"
                    max="90"
                    step="1"
                >
            </div>

            <div class="range-setting">
                <div class="range-setting-header">
                    <label
                        for="display-brightness-input"
                        data-i18n="settings.displayBrightness"
                    ></label>

                    <output
                        id="display-brightness-value"
                        for="display-brightness-input"
                    ></output>
                </div>

                <input
                    id="display-brightness-input"
                    type="range"
                    min="50"
                    max="150"
                    step="1"
                >
            </div>
        </section>

        <footer class="settings-footer">
            <button
                id="ok-settings-btn"
                class="control-button primary-button"
                type="button"
                data-i18n="settings.ok"
            ></button>

            <button
                id="cancel-settings-btn"
                class="control-button"
                type="button"
                data-i18n="settings.cancel"
            ></button>

            <button
                id="apply-settings-btn"
                class="control-button"
                type="button"
                data-i18n="settings.apply"
                disabled
            ></button>
        </footer>
    </main>

    <script type="module" src="/settings.js"></script>
</body>

</html>
