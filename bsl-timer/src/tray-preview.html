<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSL-Timer</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('bsl-timer.theme') || 'green';
      document.documentElement.dataset.glow =
        localStorage.getItem('bsl-timer.glow') === 'false' ? 'off' : 'on';
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/tray-preview.css" />
  </head>
  <body class="tray-preview-body">
    <main class="tray-preview-card" id="tray-preview-card">
      <div class="tray-preview-header">
        <span class="tray-preview-name" id="tray-preview-name">BSL-Timer</span>
        <span class="tray-preview-status" id="tray-preview-status"></span>
      </div>
      <div class="tray-preview-time" id="tray-preview-time">00:00:00</div>
      <div class="tray-preview-summary" id="tray-preview-summary" hidden></div>
    </main>
    <script type="module" src="/tray-preview.js"></script>
  </body>
</html>
