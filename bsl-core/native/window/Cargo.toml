[package]
name = "bsl-desktop-window"
version = "0.8.2"
edition = "2021"

[dependencies]
serde_json = { version = "1", optional = true }
tauri = { version = "2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
webview2-com = { version = "=0.38.2", optional = true }
window-vibrancy = "0.7.1"

[features]
composition-preview = ["dep:cc"]
glass-surface = ["dep:cc", "dep:windows", "dep:webview2-com", "dep:serde_json", "tauri/image-png"]

[build-dependencies]
cc = { version = "=1.2.64", optional = true }
